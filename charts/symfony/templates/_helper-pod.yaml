{{- define "pod.env" }}
- name: POD_NAME
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
- name: POD_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
- name: NODE_NAME
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: NODE_IP
  valueFrom:
    fieldRef:
      fieldPath: status.hostIP
- name: IMAGE_TAG
  value: {{ .Values.app.image.tag }}
{{- end }}

{{/* Template for rendering dnsConfig defined in values - .Values.customDnsConfig */}}
{{- define "pod.dns.config" }}
{{- if .Values.customDnsConfig.enabled }}
dnsConfig:
  options:
  {{- .Values.customDnsConfig.options | toYaml | nindent 2 }}
{{- end }}
{{- end }}

{{/* Template for rendering volumes */}}
{{- define "pod.volumes" }}
- name: www-data
  emptyDir: {}
- name: nginxconf
  configMap:
    name: {{ template "symfony.fullname" . }}-nginx
- name: phpconf
  configMap:
    name: {{ template "symfony.fullname" . }}-php
- name: env
  {{- if eq .Values.envMode "production" }}
  secret:
    secretName: {{ template "symfony.fullname" . }}-env
  {{- else }}
  configMap:
    name:  {{ template "symfony.fullname" . }}-env
  {{- end }}
{{- if not (eq .Values.envMode "production") }}
{{- range .Values.extraMounts }}
- name: {{ .name }}
  secret:
    secretName: {{ .name }}
{{- end }}
{{- end }}
{{- end }}

{{/* Template for rendering volume mounts */}}
{{- define "pod.volumeMounts" }}
- name: www-data
  mountPath: /var/www
- name: env
  mountPath: /var/www/.env
  subPath: .env
- name: nginxconf
  mountPath: /etc/nginx/nginx.conf
  subPath: nginx.conf
- name: phpconf
  mountPath: /etc/php/7.3/php-fpm.d/www.conf
  subPath: zz-docker.conf
- name: phpconf
  mountPath: /etc/php/7.3/php.ini
  subPath: php.ini
{{- if eq .Values.envMode "production" }}
{{- range .Values.extraMounts }}
- name: env
  mountPath: {{ .mountPath }}
  subPath: {{ .subPath }}
{{- end }}
{{- else }}
{{- range .Values.extraMounts }}
- name: {{ .name }}
  mountPath: {{ .mountPath }}
  subPath: {{ .subPath }}
{{- end }}
{{- end }}
{{- end }}
